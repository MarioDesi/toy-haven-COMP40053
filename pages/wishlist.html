<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width initial-scale=1.0">
    <meta name="description" content="Toy Haven - Wishlist Page">
    <title>Toy Haven - Wishlist Page</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/wishlist.css">
    <script src="../js/header_footer.js" defer></script>
    <link rel="icon" href="../images/logo.png">
    <script src="../js/main.js" defer></script>
    <script src="../js/wishlist.js" defer></script>
</head>

<body>


    <!-- Wishlist -->
    <main class="wishlist-page">

        <section class="wishlist-heading">

            <h1>My Wishlist</h1>

            <p>
                Manage the products you're interested in,
                not interested in, or already own.
            </p>

        </section>


        <!-- Interested -->
        <section class="wishlist-group">

            <h2>Interested</h2>

            <div
                class="wishlist-grid"
                id="interested-products"
            ></div>

            <p
                class="empty-message"
                id="interested-empty"
            >
                You don't have any interested products.
            </p>

        </section>


        <!-- Not Interested -->
        <section class="wishlist-group">

            <h2>Not Interested</h2>

            <div
                class="wishlist-grid"
                id="not-interested-products"
            ></div>

            <p
                class="empty-message"
                id="not-interested-empty"
            >
                You don't have any products marked as not interested.
            </p>

        </section>


        <!-- Owned -->
        <section class="wishlist-group">

            <h2>Owned</h2>

            <div
                class="wishlist-grid"
                id="owned-products"
            ></div>

            <p
                class="empty-message"
                id="owned-empty"
            >
                You don't have any owned products.
            </p>

        </section>

    </main>







</body>

</html>
